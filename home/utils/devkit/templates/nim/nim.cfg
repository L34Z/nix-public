# Resolve `import __NAME__` (and submodules) from src/ without a path prefix,
# in nimble builds and direct `nim c` / test compiles alike.
--path:"$config/src"

# Keep every artifact under build/ so the tree stays clean and `run clean`
# (rm -rf build nimcache) sweeps it all in one shot.
--outdir:"build"
--nimcache:"build/nimcache"
